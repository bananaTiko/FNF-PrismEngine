name: Build

on:
  push:
    branches: [main, experimental, Prism-Engine-Main]

  pull_request:
    branches: [main, experimental, Prism-Engine-Main]

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Linux compilation.
  buildLinux:
    name: Build Linux
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.4

      # Restore dependencies from previous runs.
      - name: Cache Haxelib
        uses: actions/cache@v4
        with:
          path: ~/haxelib
          key: linux-haxelib-4.3.4-${{ hashFiles('Project.xml', 'haxelib.json', 'setup/**') }}
          restore-keys: |
            linux-haxelib-4.3.4-

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvlc-dev libvlccore-dev

      - name: Install Haxelibs
        run: |
          haxelib setup ~/haxelib
          haxelib install hxcpp --quiet
          chmod +x ./setup/unix.sh
          sh ./setup/unix.sh

      - name: Skip SScript setup mode
        run: echo 'oy9:showMacroty8:loopCosti25y10:includeAllfg' >> ~/settings.cocoa

      - name: Create Version Tag
        run: echo "${{ github.run_id }}" > VERSION

      - name: Compile
        run: haxelib run lime build Project.xml linux --app-version="4.0.0-${{ github.run_id }}" -D officialBuild

      - name: Publish Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linuxBuild
          path: export/release/linux/bin

  # Windows compilation.
  buildWindows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.4

      # Restore dependencies from previous runs.
      - name: Cache Haxelib
        uses: actions/cache@v4
        with:
          path: C:/haxelib
          key: windows-haxelib-4.3.4-${{ hashFiles('Project.xml', 'haxelib.json', 'setup/**') }}
          restore-keys: |
            windows-haxelib-4.3.4-

      - name: Install Haxelibs
        shell: cmd
        run: |
          haxelib setup C:/haxelib
          haxelib install hxcpp --quiet
          .\setup\windows.bat

      - name: Skip SScript setup mode
        run: echo oy9:showMacroty8:loopCosti25y10:includeAllfg >> %USERPROFILE%/settings.cocoa
        shell: cmd

      - name: Create Version Tag
        run: echo "${{ github.run_id }}" > VERSION

      - name: Compile
        run: haxelib run lime build windows --app-version="4.0.0-${{ github.run_id }}" -D officialBuild

      - name: Publish Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windowsBuild
          path: export/release/windows/bin

  # macOS compilation.
  buildMac:
    name: Build macOS
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.4

      # Restore dependencies from previous runs.
      - name: Cache Haxelib
        uses: actions/cache@v4
        with:
          path: ~/haxelib
          key: mac-haxelib-4.3.4-${{ hashFiles('Project.xml', 'haxelib.json', 'setup/**') }}
          restore-keys: |
            mac-haxelib-4.3.4-

      - name: Install Haxelibs
        run: |
          haxelib setup ~/haxelib
          haxelib install hxcpp --quiet
          chmod +x ./setup/unix.sh
          sh ./setup/unix.sh

      - name: Skip SScript setup mode
        run: echo 'oy9:showMacroty8:loopCosti25y10:includeAllfg' >> ~/settings.cocoa

      # Fix hxcpp's bundled zlib for modern macOS SDKs.
      - name: Patch hxcpp's bundled zlib
        run: |
          set -e
          for f in $(find "$HOME/haxelib/hxcpp" -name zutil.h -path '*zlib*'); do
            echo "Patching $f"
            sed -i '' 's/#if defined(MACOS) || defined(TARGET_OS_MAC)/#if defined(MACOS)/' "$f"
            grep -q '^#if defined(MACOS)$' "$f"
          done

      - name: Create Version Tag
        run: echo "${{ github.run_id }}" > VERSION

      - name: Compile
        run: |
          set -o pipefail
          if haxelib run lime build mac --app-version="4.0.0-${{ github.run_id }}" -D officialBuild > build.log 2>&1; then
            tail -5 build.log
          else
            echo '::group::Compile errors'
            grep -n -i -E 'error|undefined symbol|ld: ' build.log | tail -60 || true
            echo '::endgroup::'
            exit 1
          fi

      - name: Publish Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macBuild
          path: export/release/macos/bin
