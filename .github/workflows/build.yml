name: Build

on:
  push:
    branches: [main, experimental, Prism-Engine-Main]

  pull_request:
    branches: [main, experimental, Prism-Engine-Main]

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Install all platform dependencies before compiling.
  dependencies:
    name: Setup All Dependencies
    uses: ./.github/workflows/setup-dependencies.yml

  # Linux compilation.
  buildLinux:
    name: Build Linux
    needs: dependencies
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.4

      - name: Setup Haxelib
        run: haxelib setup ~/haxelib

      - name: Download Haxelibs
        uses: actions/download-artifact@v4
        with:
          name: haxelibs-linux

      - name: Restore Haxelibs
        run: tar -xzf haxelibs.tar.gz -C "$HOME"

      # hxcpp keys every generated .cpp by an md5 of its contents and reads the cache
      # folder from this variable, so a push only compiles what actually changed.
      - name: Cache compiled objects
        uses: actions/cache@v4
        with:
          path: ~/.hxcpp_cache
          key: ${{ runner.os }}-hxcpp-cache-${{ hashFiles('Project.xml', 'source/**/*.hx') }}
          restore-keys: |
            ${{ runner.os }}-hxcpp-cache-

      - name: Enable hxcpp's object cache
        run: echo "HXCPP_COMPILE_CACHE=$HOME/.hxcpp_cache" >> "$GITHUB_ENV"

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvlc-dev libvlccore-dev

      - name: Skip SScript setup mode
        run: echo 'oy9:showMacroty8:loopCosti25y10:includeAllfg' >> ~/settings.cocoa

      - name: Create Version Tag
        run: echo "${{ github.run_id }}" > VERSION

      # A full hxcpp build prints thousands of lines, so the log only comes out
      # when something failed.
      - name: Compile
        run: |
          set -o pipefail
          if haxelib run lime build Project.xml linux --app-version="4.0.0-${{ github.run_id }}" \
              -D officialBuild > build.log 2>&1; then
            du -sh "$HXCPP_COMPILE_CACHE" || true
            tail -5 build.log
          else
            echo '::group::Compile errors'
            grep -n -i -E 'error|undefined symbol|ld: ' build.log | tail -60 || true
            echo '::endgroup::'
            tail -20 build.log
            exit 1
          fi

      - name: Publish Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linuxBuild
          path: export/release/linux/bin

  # Windows compilation.
  buildWindows:
    name: Build Windows
    needs: dependencies
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.4

      - name: Setup Haxelib
        run: haxelib setup C:/haxelib
        shell: cmd

      - name: Download Haxelibs
        uses: actions/download-artifact@v4
        with:
          name: haxelibs-windows

      - name: Restore Haxelibs
        run: tar -xzf haxelibs.tar.gz -C C:/
        shell: pwsh

      # Same md5-keyed object cache as the other platforms: this is what keeps a
      # Windows push from recompiling the whole engine.
      - name: Cache compiled objects
        uses: actions/cache@v4
        with:
          path: C:/hxcpp_cache
          key: ${{ runner.os }}-hxcpp-cache-${{ hashFiles('Project.xml', 'source/**/*.hx') }}
          restore-keys: |
            ${{ runner.os }}-hxcpp-cache-

      - name: Enable hxcpp's object cache
        run: echo HXCPP_COMPILE_CACHE=C:/hxcpp_cache>> %GITHUB_ENV%
        shell: cmd

      - name: Skip SScript setup mode
        run: echo oy9:showMacroty8:loopCosti25y10:includeAllfg >> %USERPROFILE%/settings.cocoa
        shell: cmd

      - name: Create Version Tag
        run: echo "${{ github.run_id }}" > VERSION

      - name: Compile
        run: haxelib run lime build windows --app-version="4.0.0-${{ github.run_id }}" -D officialBuild

      - name: Publish Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windowsBuild
          path: export/release/windows/bin

  # macOS compilation.
  buildMac:
    name: Build macOS
    needs: dependencies
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.4

      - name: Setup Haxelib
        run: haxelib setup ~/haxelib

      - name: Download Haxelibs
        uses: actions/download-artifact@v4
        with:
          name: haxelibs-mac

      - name: Restore Haxelibs
        run: tar -xzf haxelibs.tar.gz -C "$HOME"

      - name: Cache compiled objects
        uses: actions/cache@v4
        with:
          path: ~/.hxcpp_cache
          key: ${{ runner.os }}-hxcpp-cache-${{ hashFiles('Project.xml', 'source/**/*.hx') }}
          restore-keys: |
            ${{ runner.os }}-hxcpp-cache-

      - name: Enable hxcpp's object cache
        run: echo "HXCPP_COMPILE_CACHE=$HOME/.hxcpp_cache" >> "$GITHUB_ENV"

      - name: Skip SScript setup mode
        run: echo 'oy9:showMacroty8:loopCosti25y10:includeAllfg' >> ~/settings.cocoa

      # Fix hxcpp's bundled zlib for modern macOS SDKs.
      - name: Patch hxcpp's bundled zlib
        run: |
          set -e
          for f in $(find "$HOME/haxelib/hxcpp" -name zutil.h -path '*zlib*'); do
            echo "Patching $f"
            sed -i '' 's/#if defined(MACOS) || defined(TARGET_OS_MAC)/#if defined(MACOS)/' "$f"
            grep -q '^#if defined(MACOS)$' "$f"
          done

      - name: Create Version Tag
        run: echo "${{ github.run_id }}" > VERSION

      - name: Compile
        run: |
          set -o pipefail
          if haxelib run lime build mac --app-version="4.0.0-${{ github.run_id }}" -D officialBuild > build.log 2>&1; then
            du -sh "$HXCPP_COMPILE_CACHE" || true
            tail -5 build.log
          else
            echo '::group::Compile errors'
            grep -n -i -E 'error|undefined symbol|ld: ' build.log | tail -60 || true
            echo '::endgroup::'
            tail -20 build.log
            exit 1
          fi

      - name: Publish Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macBuild
          path: export/release/macos/bin
