# Builds the Linux, Windows and macOS releases on every push.
#
# hxcpp regenerates its C++ and recompiles the whole tree on a fresh runner, which
# is why these runs take so long. hxcpp has its own content-hashed object cache
# (`HXCPP_COMPILE_CACHE`), so every generated .cpp that is byte-identical to a
# previous run is copied out of the cache instead of compiled — that covers the
# engine, the haxelibs, and every file in this project that a push did not touch.
# The cache folder is persisted between runs, and the haxelib folder is too, so
# `setup/unix.sh` only downloads again when the dependency list changes.

name: Build

on:
  push:
    branches: [ main, experimental, Prism-Engine-Main ]
  pull_request:
    branches: [ main, experimental, Prism-Engine-Main ]
  workflow_dispatch:

# A newer push makes the older run pointless: cancel it instead of letting three
# full builds queue up behind each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  buildLinux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4.1.7

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.4

      - name: Cache haxelibs
        id: haxelib-cache
        uses: actions/cache@v4
        with:
          path: ~/haxelib
          key: ${{ runner.os }}-haxelib-${{ hashFiles('Project.xml', 'setup/unix.sh') }}

      - name: Cache compiled objects
        uses: actions/cache@v4
        with:
          path: ~/.hxcpp_cache
          key: ${{ runner.os }}-hxcpp-cache-${{ hashFiles('Project.xml', 'source/**/*.hx') }}
          restore-keys: |
            ${{ runner.os }}-hxcpp-cache-

      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libvlc-dev libvlccore-dev

      # hxcpp picks this up from the environment and keys every object by an md5 of
      # its source, so only files this run actually changed get compiled.
      - name: Enable hxcpp's object cache
        run: echo "HXCPP_COMPILE_CACHE=$HOME/.hxcpp_cache" >> "$GITHUB_ENV"

      - name: Point haxelib at the cache
        run: haxelib setup ~/haxelib

      - name: Install Haxelib
        if: steps.haxelib-cache.outputs.cache-hit != 'true'
        run: |
          haxelib install hxcpp
          chmod +x ./setup/unix.sh
          sh ./setup/unix.sh

      - name: Make sure hxcpp is present
        run: haxelib list | grep -q '^hxcpp' || haxelib install hxcpp

      - name: Skip SScript setup mode
        run: echo 'oy9:showMacroty8:loopCosti25y10:includeAllfg' >> ~/settings.cocoa

      - name: Create Version Tag
        run: echo "${{ github.run_id }}" > VERSION

      - name: Compile
        run: |
          set -o pipefail
          haxelib run lime build Project.xml linux --app-version="4.0.0-${{ github.run_id }}" \
            -D officialBuild > build.log 2>&1 || {
            echo '::group::Compile errors'
            grep -n -i -E 'error|undefined symbol|ld: ' build.log | tail -60 || true
            echo '::endgroup::'
            exit 1
          }
          du -sh "$HXCPP_COMPILE_CACHE" || true
          tail -5 build.log

      - name: Publish Artifact
        uses: actions/upload-artifact@v4.3.4
        with:
          name: linuxBuild
          path: 'export/release/linux/bin'

  buildWindows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4.1.7

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.4

      - name: Cache haxelibs
        id: haxelib-cache
        uses: actions/cache@v4
        with:
          path: C:/haxelib
          key: ${{ runner.os }}-haxelib-${{ hashFiles('Project.xml', 'setup/windows.bat') }}

      - name: Cache compiled objects
        uses: actions/cache@v4
        with:
          path: C:/hxcpp_cache
          key: ${{ runner.os }}-hxcpp-cache-${{ hashFiles('Project.xml', 'source/**/*.hx') }}
          restore-keys: |
            ${{ runner.os }}-hxcpp-cache-

      - name: Point haxelib at the cache
        run: haxelib setup C:/haxelib
        shell: cmd

      - name: Install Haxelib
        if: steps.haxelib-cache.outputs.cache-hit != 'true'
        run: |
          haxelib install hxcpp
          .\setup\windows.bat
        shell: cmd

      - name: Make sure hxcpp is present
        run: haxelib list | findstr /B /C:"hxcpp" >nul || haxelib install hxcpp
        shell: cmd

      # hxcpp reads this from the environment; it keys objects by source md5, so only
      # what changed gets compiled.
      - name: Enable hxcpp's object cache
        run: echo HXCPP_COMPILE_CACHE=C:/hxcpp_cache>> %GITHUB_ENV%
        shell: cmd

      - name: Skip SScript setup mode
        run: echo 'oy9:showMacroty8:loopCosti25y10:includeAllfg' >> %USERPROFILE%/settings.cocoa
        shell: cmd

      - name: Create Version Tag
        run: echo "${{ github.run_id }}" > VERSION

      - name: Compile
        run: |
          haxelib run lime build windows --app-version="4.0.0-${{ github.run_id }}" -D officialBuild > build.log 2>&1
          if %ERRORLEVEL% NEQ 0 (
            echo ::group::Compile errors
            findstr /R /C:"error" build.log | more
            echo ::endgroup::
            exit /b 1
          )
          powershell -Command "Get-Content build.log -Tail 5"
        shell: cmd

      - name: Publish Artifact
        uses: actions/upload-artifact@v4.3.4
        with:
          name: windowsBuild
          path: export/release/windows/bin

  buildMac:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4.1.7

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.4

      - name: Cache haxelibs
        id: haxelib-cache
        uses: actions/cache@v4
        with:
          path: ~/haxelib
          key: ${{ runner.os }}-haxelib-${{ hashFiles('Project.xml', 'setup/unix.sh') }}

      - name: Cache compiled objects
        uses: actions/cache@v4
        with:
          path: ~/.hxcpp_cache
          key: ${{ runner.os }}-hxcpp-cache-${{ hashFiles('Project.xml', 'source/**/*.hx') }}
          restore-keys: |
            ${{ runner.os }}-hxcpp-cache-

      - name: Point haxelib at the cache
        run: haxelib setup ~/haxelib

      - name: Install Haxelib
        if: steps.haxelib-cache.outputs.cache-hit != 'true'
        run: |
          haxelib install hxcpp
          chmod +x ./setup/unix.sh
          sh ./setup/unix.sh

      - name: Make sure hxcpp is present
        run: haxelib list | grep -q '^hxcpp' || haxelib install hxcpp

      - name: Enable hxcpp's object cache
        run: echo "HXCPP_COMPILE_CACHE=$HOME/.hxcpp_cache" >> "$GITHUB_ENV"

      - name: Skip SScript setup mode
        run: echo 'oy9:showMacroty8:loopCosti25y10:includeAllfg' >> ~/settings.cocoa

      # hxcpp 4.3.2 bundles zlib 1.2.11, and its zutil.h treats TARGET_OS_MAC (which Apple's
      # own headers always define) as classic Mac OS 9: it turns fdopen into a NULL macro and
      # sets an OS/2 code. Against the macOS 14+/15 SDK that breaks <stdio.h> itself
      # ("expected identifier or '('"), so drop the obsolete branch and keep the real fdopen.
      - name: Patch hxcpp's bundled zlib for the modern macOS SDK
        run: |
          set -e
          for f in $(find "$HOME/haxelib/hxcpp" -name zutil.h -path '*zlib*'); do
            echo "patching $f"
            sed -i '' 's/#if defined(MACOS) || defined(TARGET_OS_MAC)/#if defined(MACOS)/' "$f"
            grep -q '^#if defined(MACOS)$' "$f"
          done

      - name: Create Version Tag
        run: echo "${{ github.run_id }}" > VERSION

      # Keep the job log readable: a full hxcpp build is far too big to page through, so the
      # whole output goes to a file and only the errors are printed if the build fails.
      - name: Compile
        run: |
          set -o pipefail
          if haxelib run lime build mac --app-version="4.0.0-${{ github.run_id }}" \
              -D officialBuild > build.log 2>&1; then
            du -sh "$HXCPP_COMPILE_CACHE" || true
            tail -5 build.log
          else
            echo '::group::Compile errors'
            grep -n -i -E 'error|undefined symbol|ld: ' build.log | tail -60 || true
            echo '::endgroup::'
            exit 1
          fi

      - name: Publish Artifact
        uses: actions/upload-artifact@v4.3.4
        with:
          name: macBuild
          path: export/release/macos/bin
