
name: Setup Dependencies

on:
  workflow_call:

jobs:
  install:
    name: Install Haxelibs (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            haxelib-path: ~/haxelib

          - platform: windows
            os: windows-latest
            haxelib-path: C:/haxelib

          - platform: mac
            os: macos-15
            haxelib-path: ~/haxelib

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.4

      # Restore dependencies from previous runs.
      - name: Cache Haxelib
        uses: actions/cache@v4
        with:
          path: |
            ${{ matrix.haxelib-path }}
          key: ${{ matrix.platform }}-haxelib-4.3.4-${{ hashFiles('Project.xml', 'haxelib.json', 'setup/**') }}
          restore-keys: |
            ${{ matrix.platform }}-haxelib-4.3.4-

      # Install Linux dependencies.
      - name: Install Linux Dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvlc-dev libvlccore-dev

      # Install Haxelibs on Linux and macOS.
      - name: Install Unix Haxelibs
        if: matrix.platform == 'linux' || matrix.platform == 'mac'
        run: |
          haxelib setup ~/haxelib
          haxelib install hxcpp --quiet
          chmod +x ./setup/unix.sh
          sh ./setup/unix.sh

      # Install Haxelibs on Windows.
      - name: Install Windows Haxelibs
        if: matrix.platform == 'windows'
        shell: cmd
        run: |
          haxelib setup C:/haxelib
          haxelib install hxcpp --quiet
          .\"setup/windows.bat"

      # Package the installed Haxelib repository.
      - name: Package Haxelibs
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "windows" ]; then
            tar -czf haxelibs.tar.gz -C C:/ haxelib
          else
            tar -czf haxelibs.tar.gz -C "$HOME" haxelib
          fi

      # Transfer dependencies to the build workflow.
      - name: Upload Haxelibs
        uses: actions/upload-artifact@v4
        with:
          name: haxelibs-${{ matrix.platform }}
          path: haxelibs.tar.gz
          retention-days: 1
