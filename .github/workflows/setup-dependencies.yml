name: Setup Dependencies

on:
  workflow_call:

jobs:
  install:
    name: Install Haxelibs (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            haxelib-path: ~/haxelib

          - platform: windows
            os: windows-latest
            haxelib-path: C:/haxelib

          - platform: mac
            os: macos-15
            haxelib-path: ~/haxelib

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.4

      # Restore dependencies from previous runs. Every git dependency in the setup
      # scripts is re-cloned by a fresh install, so a hit here is worth minutes.
      - name: Cache Haxelib
        id: haxelib-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ matrix.haxelib-path }}
          key: ${{ matrix.platform }}-haxelib-4.3.4-${{ hashFiles('Project.xml', 'setup/**') }}
          restore-keys: |
            ${{ matrix.platform }}-haxelib-4.3.4-

      # The haxelib pointer itself lives outside the cached directory, so it is
      # always set; the installs below are what the cache makes redundant.
      - name: Setup Haxelib
        if: matrix.platform != 'windows'
        run: haxelib setup ~/haxelib

      - name: Setup Haxelib
        if: matrix.platform == 'windows'
        shell: cmd
        run: haxelib setup C:/haxelib

      # Install Haxelibs on Linux and macOS.
      - name: Install Unix Haxelibs
        if: (matrix.platform == 'linux' || matrix.platform == 'mac') && steps.haxelib-cache.outputs.cache-hit != 'true'
        run: |
          haxelib install hxcpp 4.3.2 --quiet
          chmod +x ./setup/unix.sh
          sh ./setup/unix.sh

      # Install Haxelibs on Windows. The script ends on `pause`, so it gets an empty
      # stdin instead of waiting for a key press that never comes.
      - name: Install Windows Haxelibs
        if: matrix.platform == 'windows' && steps.haxelib-cache.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          haxelib install hxcpp 4.3.2 --quiet
          call .\setup\windows.bat < nul

      # Package the installed Haxelib repository.
      - name: Package Haxelibs
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "windows" ]; then
            tar -czf haxelibs.tar.gz -C C:/ haxelib
          else
            tar -czf haxelibs.tar.gz -C "$HOME" haxelib
          fi

      # Transfer dependencies to the build workflow.
      - name: Upload Haxelibs
        uses: actions/upload-artifact@v4
        with:
          name: haxelibs-${{ matrix.platform }}
          path: haxelibs.tar.gz
          retention-days: 1
